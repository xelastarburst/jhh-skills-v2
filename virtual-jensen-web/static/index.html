<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Meeting with Jensen Huang</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧥</text></svg>">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1><span class="nvidia-green">■</span> Strategy Meeting with Jensen Huang</h1>
            <div class="subtitle">No slides. No status reports. Just the whiteboard.</div>
            <div class="model-selector">
                <label for="model-select">Model:</label>
                <select id="model-select"></select>
            </div>
        </header>

        <div class="chat-container" id="chat-container">
            <div class="welcome" id="welcome">
                <div class="icon">🧥</div>
                <p>
                    Step into a strategy meeting with Jensen Huang.
                    Bring your product idea — he'll stress-test your thinking
                    through first principles, reasoning chains, and the
                    relentless pursuit of the speed of light.
                </p>
                <button class="start-btn" id="start-btn">Enter the Meeting Room</button>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea
                    id="message-input"
                    placeholder="Share your thinking..."
                    rows="1"
                    disabled
                ></textarea>
                <button id="send-btn" disabled>
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
            <div class="new-meeting">
                <button id="new-meeting-btn">↻ New Meeting</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
