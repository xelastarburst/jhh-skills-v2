<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Meeting with Jensen Huang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2215%22 y=%2215%22 width=%2270%22 height=%2270%22 fill=%22%2376b900%22/%3E</svg>">
</head>
<body>
    <div class="noise"></div>
    <div class="app">
        <header class="header">
            <div class="brand">
                <span class="brand-mark"></span>
                <span class="brand-text">Virtual Jensen</span>
            </div>
            <div class="header-right">
                <select id="mode-select" aria-label="Mode"></select>
                <select id="model-select" aria-label="Model"></select>
                <a href="/research" class="header-link">Sources</a>
            </div>
        </header>

        <div class="chat-container" id="chat-container">
            <div class="welcome" id="welcome">
                <div class="welcome-inner">
                    <div class="welcome-badge">Strategy Session</div>
                    <h1 class="welcome-title">
                        <span class="welcome-pre">A meeting with</span>
                        Jensen Huang
                    </h1>
                    <p class="welcome-desc">
                        No slides. No status reports. Just the whiteboard.<br>
                        Bring your product idea &mdash; he'll stress-test your thinking
                        through first principles, reasoning chains, and the relentless
                        pursuit of the speed of light.
                    </p>
                    <button class="start-btn" id="start-btn">
                        Enter the Room
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-row">
                <textarea
                    id="message-input"
                    placeholder="Share your thinking..."
                    rows="1"
                    disabled
                ></textarea>
                <button id="send-btn" disabled aria-label="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
            <div class="input-footer">
                <button id="new-meeting-btn">New Meeting</button>
                <div class="export-group" id="export-group" style="display:none">
                    <button id="export-summary-btn" title="Generate a shareable summary">Summary</button>
                    <button id="export-transcript-btn" title="Download full chat transcript">Transcript</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Export modal -->
    <div class="modal-overlay" id="export-modal" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Summary</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-actions">
                <button id="modal-copy">Copy</button>
                <button id="modal-download">Download .md</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
